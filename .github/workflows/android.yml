name: Сборка APK

# Запускается вручную кнопкой Run workflow или при пуше тега v*
on:
  workflow_dispatch:
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Android SDK
        uses: android-actions/setup-android@v3

      - name: Зависимости и сборка фронта
        working-directory: frontend
        run: |
          npm ci || npm install
          npm run build

      - name: Оболочка Capacitor
        working-directory: frontend
        run: |
          cp ../android/capacitor.config.json
          npm install @capacitor/core @capacitor/cli @capacitor/android
          npx cap add android || npx cap sync android
          # разрешаем открытый HTTP только для адреса CRM
          mkdir -p android/app/src/main/res/xml
          cp ../android/res/xml/network_security_config.xml android/app/src/main/res/xml/
          sed -i 's|<application |<application android:networkSecurityConfig="@xml/network_security_config" |' \
            android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Gradle
        working-directory: frontend/android
        run: |
          chmod +x gradlew
          ./gradlew assembleDebug

      - name: Забрать APK
        uses: actions/upload-artifact@v4
        with:
          name: sn7-crm-apk
          path: frontend/android/app/build/outputs/apk/debug/app-debug.apk
